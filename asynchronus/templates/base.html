<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
    <!-- inline script — apply dark mode instantly, before anything renders -->
    <script>
        (function () {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', saved);
        })();
    </script>
    <!-- bootstrap JS first (deferred), then our scripts that depend on it -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="{{ url_for('static', path='js/utils.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/auth.js') }}" defer></script>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-semibold" href="/">Blog</a>

    <button class="navbar-toggler ms-auto me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link" href="/posts">Posts</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="openNewPostModal()">+ New Post</a>
            </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
            <div class="form-check form-switch mb-0 d-flex align-items-center gap-2">
                <input class="form-check-input" type="checkbox" id="themeToggle"
                    style="cursor:pointer; width:2.5em; height:1.25em;" />
                <label class="form-check-label text-white-50 small" for="themeToggle" id="themeLabel">🌙</label>
            </div>

            <!-- Auth area — filled in by utils.js based on whether a token exists -->
            <div id="authArea" class="d-flex align-items-center gap-2">
                <a href="/login" class="btn btn-sm btn-outline-light">Login</a>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5" style="max-width: 760px;">
    {% block content %}{% endblock %}
</div>

<!-- New Post Modal -->
<div class="modal fade" id="newPostModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-semibold">New Post</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="newPostError" class="alert alert-danger d-none"></div>
                <div class="mb-3">
                    <label class="form-label fw-medium" for="newTitle">Title</label>
                    <input type="text" class="form-control" id="newTitle" placeholder="Post title" />
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium" for="newContent">Content</label>
                    <textarea class="form-control" id="newContent" rows="6" placeholder="Write your post..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveNewPost()">Publish</button>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', path='js/utils.js') }}?v=2" defer></script>
<script src="{{ url_for('static', path='js/auth.js') }}?v=2" defer></script>
</body>
</html>
