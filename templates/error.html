{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white border border-slate-200 rounded-2xl p-8 shadow-sm text-center space-y-6">
    <div class="w-16 h-16 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center mx-auto text-2xl font-black border border-rose-100">
        !
    </div>
    
    <div class="space-y-2">
        <h1 class="text-4xl font-black text-slate-900 tracking-tight">{{ status_code }}</h1>
        <h3 class="text-lg font-bold text-slate-700">Application Exception Triggered</h3>
        <p class="text-slate-500 text-sm leading-relaxed pt-2 bg-slate-50 p-4 rounded-xl border border-slate-100">
            "{{ message }}"
        </p>
    </div>

    <div class="pt-4 border-t border-slate-100">
        <a href="/" class="inline-block bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm px-6 py-2.5 rounded-lg transition-all shadow-sm">
            Return to Safe Dashboard
        </a>
    </div>
</div>
{% endblock %}
