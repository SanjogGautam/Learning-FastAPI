<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if title %}
            Sanjog's FastAPI - {{ title }}
        {% else %}
            Sanjog's FastAPI
        {% endif %}
    </title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="{{ url_for('static', path='css/output.css') }}">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-black tracking-tight text-indigo-600">Bazar<span class="text-slate-900">NP</span></span>
            </div>
            <div class="flex items-center space-x-6 font-medium text-slate-600">
                <a href="{{ url_for('home') }}" class="hover:text-indigo-600 transition-colors">Home</a>
                <a href="#" class="hover:text-indigo-600 transition-colors">Order History</a>
                <a href="/api/posts" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm transition-all">API Docs</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        &copy; Sanjog's FastAPI. Built cleanly with FastAPI & Tailwind.
    </footer>

</body>
</html>
