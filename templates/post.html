{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-2xl p-8 shadow-sm space-y-6">
    <a href="{{url_for('home')}}" class="text-sm font-medium text-indigo-600 hover:text-indigo-700 transition-colors">&larr; Back to Dashboard</a>
    
    <div class="border-b border-slate-100 pb-4">
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">{{ post.name }}</h1>
        <p class="text-xs text-slate-400 font-semibold mt-1 uppercase tracking-wider">Account Member Verification Active</p>
    </div>

    <p class="text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100 italic">
        "{{ post.content }}"
    </p>
</div>
{% endblock %}
