{% extends "base.html" %}

{% block content %}
<a href="/" class="text-muted small text-decoration-none d-inline-block mb-4">&larr; Back to posts</a>

<article>
    <div class="d-flex justify-content-between align-items-start mb-3">
        <h2 class="fw-semibold mb-0">{{ post.title }}</h2>
        <div class="d-flex gap-2 ms-3">
            <button
                class="btn btn-sm btn-outline-primary"
                onclick="openEditModal(`{{ post.id }}`, `{{ post.title | replace('`', '') }}`, `{{ post.content | replace('`', '') }}`)">
                Edit
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deletePost({{ post.id }})">
                Delete
            </button>
        </div>
    </div>

    <div class="d-flex align-items-center gap-2 mb-4 pb-3 border-bottom">
        <img
            src="{{ post.author.image_path }}"
            alt="{{ post.author.username }}"
            class="rounded-circle"
            width="30" height="30"
            style="object-fit: cover;"
            onerror="this.src='/static/profile_pics/default.jpg'"
        />
        <a href="/users/{{ post.author.id }}/posts" class="text-decoration-none small fw-medium post-title-link">
            {{ post.author.username }}
        </a>
        <span class="text-muted small">&middot; {{ post.date_posted.strftime('%B %d, %Y') }}</span>
    </div>

    <div class="lh-lg text-secondary" style="font-size: 0.97rem;">
        {% for para in post.content.split('\n\n') %}
            {% if para.strip() %}<p>{{ para.strip() }}</p>{% endif %}
        {% endfor %}
    </div>
</article>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-semibold">Edit Post</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="editError" class="alert alert-danger d-none"></div>
                <div class="mb-3">
                    <label class="form-label fw-medium" for="editTitle">Title</label>
                    <input type="text" class="form-control" id="editTitle" />
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium" for="editContent">Content</label>
                    <textarea class="form-control" id="editContent" rows="6"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
